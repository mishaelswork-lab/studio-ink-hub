name: ArtSpace CI

on:
  push:
    branches:
      - artspace/security-audit-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: artspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reconcile npm lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies from lockfile
        run: npm ci
      - name: TypeScript
        run: npx tsc -b
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm run test -- --passWithNoTests
      - name: ESLint
        run: npm run lint

  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/get-portfolio-media/index.ts
          deno check supabase/functions/get-artist-avatar/index.ts
          deno check supabase/functions/get-reel-media/index.ts
          deno check supabase/functions/instagram-connect-start/index.ts
          deno check supabase/functions/instagram-connect-callback/index.ts
          deno check supabase/functions/instagram-connection-status/index.ts
          deno check supabase/functions/instagram-import-media/index.ts
          deno check supabase/functions/create-booking-hold/index.ts
          deno check supabase/functions/create-razorpay-order/index.ts
          deno check supabase/functions/verify-razorpay-payment/index.ts
